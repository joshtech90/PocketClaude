<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- PocketClot Thinking Blob (Settings: speed 0.8x, morph 20%, 6 lobes, shine 55%) -->
  <defs>
    <radialGradient id="clotGrad" cx="38%" cy="36%" r="62%" fx="32%" fy="30%">
      <stop offset="0%" stop-color="#FDD043" />
      <stop offset="35%" stop-color="#FFB300" />
      <stop offset="70%" stop-color="#FF6D00" />
      <stop offset="92%" stop-color="#D84315" />
      <stop offset="100%" stop-color="#BF360C" />
    </radialGradient>
    
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="specularGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .wobble-container {
      transform-origin: 100px 100px;
      animation: pulseBreath 3.5s ease-in-out infinite alternate, gentleTilt 4.2s ease-in-out infinite alternate;
    }
    @keyframes pulseBreath {
      0% { transform: scale(0.95); }
      100% { transform: scale(1.05); }
    }
    @keyframes gentleTilt {
      0% { rotate: -4deg; }
      100% { rotate: 4deg; }
    }
  </style>

  <g class="wobble-container">
    <circle cx="100" cy="100" r="72" fill="#FF9800" opacity="0.22" filter="url(#ambientGlow)">
      <animate attributeName="r" values="68;76;68" dur="3.0s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.18;0.35;0.18" dur="3.0s" repeatCount="indefinite" />
    </circle>

    <path id="clotPath" fill="url(#clotGrad)" d="M 161.44,100.00 C 161.61,116.90 144.95,143.11 129.80,151.61 C 114.65,160.12 85.25,159.65 70.53,151.05 C 55.80,142.45 41.86,117.74 41.44,100.00 C 41.02,82.26 53.48,52.93 68.03,44.63 C 82.59,36.33 113.19,40.96 128.76,50.19 C 144.33,59.41 161.27,83.10 161.44,100.00 Z">
      <animate attributeName="d" 
               dur="3.8s" 
               repeatCount="indefinite" 
