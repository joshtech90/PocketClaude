    <ellipse cx="82" cy="78" rx="20" ry="14" fill="url(#specularGlow)" transform="rotate(-20 82 78)">
      <animate attributeName="cx" values="82;85;81;82" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="cy" values="78;81;77;78" dur="3.8s" repeatCount="indefinite" />
